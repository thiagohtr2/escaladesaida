<script>
'use strict';
/* ================= utilidades ================= */
const IC={
  painel:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h3v3H8z"/>',

  plus:'<path d="M12 5v14M5 12h14"/>',
  swap:'<path d="M7 7.5h12.5L16 4M17 16.5H4.5L8 20"/>',
  cl:'<path d="M14.5 6l-6 6 6 6"/>', cr:'<path d="M9.5 6l6 6-6 6"/>',
  up:'<path d="M6 14.5l6-6 6 6"/>', down:'<path d="M6 9.5l6 6 6-6"/>',
  ajustes:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>',
  copy:'<rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6A1.5 1.5 0 0 0 14 4.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/>',
  trash:'<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"/>',
  edit:'<path d="M4.5 19.5l1-4 10-10 3 3-10 10z"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  undo:'<path d="M9 14L4.5 9.5 9 5"/><path d="M4.5 9.5H14a5.5 5.5 0 0 1 0 11h-3"/>',
  ar:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  entra:'<path d="M10 17l5-5-5-5M15 12H3M14 4h4.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14"/>',
  sai:'<path d="M14 17l5-5-5-5M19 12H8M10 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H10"/>',
  ring:'<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.6 4.2v3.9h-3.9"/>',
  alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.3"/>',
  rot:'<path d="M12 4v16M6 14l6 6 6-6"/>',
  layers:'<path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5L12 17l8.5-4.5M3.5 16.5L12 21l8.5-4.5"/>',
  cal:'<path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8.5"/>',
  me:'<circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.7-3.5 3.3-5.5 6.5-5.5 1.6 0 3 .5 4.1 1.3M15.5 18l2 2 4-4"/>',
  dup:'<rect x="4" y="4" width="11" height="11" rx="2"/><path d="M9 19.5h9.5A1.5 1.5 0 0 0 20 18V9"/>'
};
const icon=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]||''}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r=document)=>r.querySelector(s);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ================= datas ================= */
const DIA=86400000;
const DIAS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const DIAS_C=['dom','seg','ter','qua','qui','sex','sáb'];
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const FREQ={7:'semanal',14:'quinzenal',21:'a cada 3 semanas',28:'a cada 4 semanas'};
function parse(s){const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}
function fmt(t){return new Date(t).toISOString().slice(0,10)}
function addDias(s,n){return fmt(parse(s)+n*DIA)}
function diff(a,b){return Math.round((parse(b)-parse(a))/DIA)}
function hojeStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dow(s){return new Date(parse(s)).getUTCDay()}
function br(s){const[y,m,d]=s.split('-');return d+'/'+m+'/'+y}
function brC(s){const[,m,d]=s.split('-');return d+'/'+m}
function extenso(s){return cap(DIAS[dow(s)])+', '+(+s.slice(8))+' de '+MESES[+s.slice(5,7)-1]}
function freqTxt(f){return FREQ[f]||('a cada '+f+' dias')}
function validaData(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'')}

/* ================= motor do rodízio ================= */
/* Posições fixas no final (ex.: CHD): ficam sempre por último; quando a escala cresce, a posição nova nasce antes delas. */
/* Posições fixas: cada uma fica sempre no final ("fim") ou sempre logo depois de uma posição numerada (âncora).
   Quando a escala cresce, a posição nova continua a numeração (P9, P10…); quando diminui, some a última numerada. */
function fixasDe(e){
  const out=[];
  if(Array.isArray(e&&e.fixas))e.fixas.forEach(f=>{const r=String(f&&f.rot||'').trim();if(r)out.push({rot:r,ancora:f.ancora&&f.ancora!=='fim'?String(f.ancora).trim():'fim'})});
  else (e&&e.fixasFim||[]).forEach(x=>{const r=String(x||'').trim();if(r)out.push({rot:r,ancora:'fim'})});
  return out;
}
function montarRotulos(e,m){
  const fx=fixasDe(e),nf=fx.map(f=>f.rot);
  const num=rotulosBase(Object.assign({},e,{rotulos:(e.rotulos||[]).filter(x=>!nf.includes(String(x||'').trim()))}),m);
  const out=[],usados=new Set();
  num.forEach(L=>{out.push(L);fx.filter(f=>f.ancora===L).forEach(f=>{out.push(f.rot);usados.add(f.rot)})});
  fx.filter(f=>f.ancora!=='fim'&&!usados.has(f.rot)).forEach(f=>out.push(f.rot));
  fx.filter(f=>f.ancora==='fim').forEach(f=>out.push(f.rot));
  return {out,num};
}
function rotulos(e,n){
  const fx=fixasDe(e);
  if(!fx.length)return rotulosBase(e,n);
  if(n<=fx.length)return montarRotulos(e,0).out.slice(0,n);
  return montarRotulos(e,n-fx.length).out;
}
function ultimaNumerada(e,n){const fx=fixasDe(e);if(!fx.length)return rotulosBase(e,n)[n-1];const num=montarRotulos(e,Math.max(n-fx.length,0)).num;return num[num.length-1]}
function rotulosBase(e,n){
  const nomes=(e.rotulos||[]).map(x=>String(x||'').trim()), pre=e.prefixo||'P', r=[];
  const re=new RegExp('^'+pre.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\d+)$');
  let ult=0;nomes.forEach(x=>{const m=x.match(re);if(m)ult=Math.max(ult,+m[1])});
  for(let i=0;i<n;i++) r.push(i<nomes.length&&nomes[i]?nomes[i]:pre+(ult+(i-nomes.length)+1));
  return r;
}
const pc=i=>'p'+(i%6);
/* Nome da posição que surge quando a escala cresce de n para n+1 pela regra "última posição". */
function rotNova(e,n){const fx=fixasDe(e);if(!fx.length)return rotulosBase(e,n+1)[n];const num=montarRotulos(e,Math.max(n-fx.length,0)+1).num;return num[num.length-1]}
function idxNova(e,n){const fx=fixasDe(e);if(!fx.length)return n;const i=rotulos(e,n+1).indexOf(rotNova(e,n));return i<0?n:i}
function girar(st,sentido){
  if(st.length<2) return st.slice();
  return sentido==='sobe'?[...st.slice(1),st[0]]:[st[st.length-1],...st.slice(0,-1)];
}
function ordenarEventos(evs){return [...(evs||[])].sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:(a.criado||0)-(b.criado||0))}
function posEntrada(e,ev,n){
  let p=ev.posicao||e.entradaPadrao||'ultima';
  if(p==='ultima') return idxNova(e,n);
  if(p==='primeira') return 0;

function aplicar(e,st,ev){
  if(ev.tipo==='troca'){

    if(st.includes(ev.entra)) return ev.entra+' já estava na equipe; a substituição foi ignorada.';
    st[i]=ev.entra; return null;
  }
  if(ev.tipo==='saida'){
    const i=st.indexOf(ev.nome);
    if(i<0) return ev.nome+' não estava na equipe; a saída foi ignorada.';
    st.splice(i,1); return null;
  }
  if(ev.tipo==='entrada'){
    if(st.includes(ev.nome)) return ev.nome+' já estava na equipe; a entrada foi ignorada.';

/* Gera todos os plantões do primeiro até "ate". A cada data: gira, depois aplica as mudanças com data ≤ data do plantão. */
function gerar(e,ate,extra){
  const out=[]; if(!e||!validaData(e.inicio)) return out;
  const todosEv=extra?[...(e.eventos||[]),extra]:(e.eventos||[]);
  const evs=ordenarEventos(todosEv.filter(x=>x.tipo!=='ausencia'));
  const aus={};ordenarEventos(todosEv.filter(x=>x.tipo==='ausencia')).forEach(x=>{(aus[x.data]=aus[x.data]||[]).push(x)});
  const freq=+e.frequencia||14; let st=[...(e.equipe||[])], ei=0, d=e.inicio, k=0;
  while(d<=ate&&k<1200){
    if(k>0) st=girar(st,e.sentido);
    const aplicados=[],avisos=[];
    while(ei<evs.length&&evs[ei].data<=d){const ev=evs[ei++];const er=aplicar(e,st,ev);if(er)avisos.push({data:d,msg:er,ev});else aplicados.push(ev)}
    /* Ausência de um dia: só este plantão muda (vago ou outra pessoa cobre); o rodízio segue igual. */
    const eq=st.slice(),pontuais=[];
    for(const a of (aus[d]||[])){const i=eq.indexOf(a.nome);
      if(i<0){avisos.push({data:d,msg:a.nome+' não estava neste plantão; a ausência foi ignorada.',ev:a});continue}
      if(a.cobre&&eq.includes(a.cobre)){avisos.push({data:d,msg:a.cobre+' já estava neste plantão; a cobertura de '+a.nome+' foi ignorada.',ev:a});continue}
      eq[i]=a.cobre||'';pontuais.push(a)}
    out.push({data:d,k,equipe:eq,base:st.slice(),eventos:aplicados,pontuais,avisos});
    d=addDias(d,freq);k++;

}
function temPlantao(e,d){return validaData(e.inicio)&&d>=e.inicio&&diff(e.inicio,d)%(+e.frequencia||14)===0}
function proxima(e,de){
  if(!validaData(e.inicio)) return null;
  if(de<=e.inicio) return e.inicio;

function linhaEm(e,d,extra){if(!temPlantao(e,d))return null;const l=gerar(e,d,extra);return l[l.length-1]||null}

const nomeOuVago=n=>n||'Vago';

function descEv(ev,e,l){
  if(ev.tipo==='troca') return ev.entra+' entra no lugar de '+ev.sai;
  if(ev.tipo==='saida') return ev.nome+' deixa a equipe; quem estava abaixo sobe uma posição';
  if(ev.tipo==='ausencia') return ev.nome+' fora só neste plantão'+(ev.cobre?'; '+ev.cobre+' cobre':'; posição vaga');
  if(ev.tipo==='entrada'){const i=l?l.equipe.indexOf(ev.nome):-1;return ev.nome+' entra na equipe'+(i>=0?' em '+rotulos(e,l.equipe.length)[i]:'')}

}

const CORES={anil:'#4758d6',verde:'#1f7a4d',azul:'#2563a8',petroleo:'#0e7490',ambar:'#b7791f',laranja:'#c2410c',vinho:'#a3304b',rosa:'#be3a78',roxo:'#6b46c1',grafite:'#475569'};

function destMapa(e){

function escalasOrd(){return [...S.escalas].filter(e=>validaData(e.inicio)).sort((a,b)=>(a.ordem||0)-(b.ordem||0)||String(a.nome).localeCompare(String(b.nome),'pt'))}

function indice(){
  const hoje=hojeStr(),ate=addDias(hoje,365),m=new Map();
  const get=n=>{if(!m.has(n))m.set(n,{nome:n,plantoes:[],escalas:new Set()});return m.get(n)};
  for(const e of escalasOrd()){
    (e.equipe||[]).forEach(n=>get(n));(e.eventos||[]).forEach(ev=>[ev.nome,ev.sai,ev.entra,ev.cobre].forEach(n=>n&&get(n)));
    for(const l of gerar(e,ate)){if(l.data<hoje)continue;const r=rotulos(e,l.equipe.length);l.equipe.forEach((n,i)=>{if(!n)return;const p=get(n);p.plantoes.push({data:l.data,e,i,rot:r[i]});p.escalas.add(e.id)})}
  }

async function gravar(fn){
  try{await fn()}
  catch(err){
    if(err&&err.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*900));try{await fn();return}catch(e2){err=e2}}
    if(err&&err.code==='invalid_argument'){S.podeEditar=false;toast('Você não tem permissão para alterar as escalas. A mudança não foi salva.',true);render()}
    else if(err&&err.code==='quota_exceeded')toast('O armazenamento está cheio. Exclua escalas antigas e tente de novo.',true);
    else toast('Não foi possível salvar agora. Verifique a conexão e tente de novo.',true);
  }
}
function salvarEscala(e){

function ajustarTabelas(){

/* Borda de posição: um único contorno por cima da tabela, do cabeçalho até a última linha, sem ser cortado pelas linhas. */
function desenharBordas(){
  document.querySelectorAll('.grade-wrap').forEach(w=>{
    w.querySelectorAll('.col-borda').forEach(x=>x.remove());
    const t=w.querySelector('.grade');if(!t)return;
    const ths=t.querySelectorAll('thead th.bd');if(!ths.length)return;
    const wr=w.getBoundingClientRect(),tb=t.getBoundingClientRect();
    ths.forEach(th=>{
      const r=th.getBoundingClientRect(),d=document.createElement('div');

      d.style.width=r.width+'px';d.style.height=(tb.bottom-r.top)+'px';
      w.appendChild(d);
    });
  });
}

  return `${head}${bannerAviso()}${tabs}${resumoProximo(e)}${avisos.length?`<p class="banner warn">${icon('alert')}<span>${avisos.map(a=>esc(br(a.data)+': '+a.msg)).join('<br>')}</span></p>`:''}<div class="schedule-workspace" style="--ac:${cor(e)}">${agenda}${folha(e,true)}</div>
    <div class="below"><div class="stack"><section class="card"><div class="card-h"><h2>Ordem do rodízio</h2>${S.podeEditar&&freq>=14?`<button class="lnk" data-act="duplicar">${icon('dup')} Criar semana alternada</button>`:''}</div><div class="card-b"><p class="muted" style="font-size:13.5px;margin-bottom:10px">Posições do próximo plantão, de ${esc(rp[0]||'')} a ${esc(rp[n-1]||'')}.</p>${ring}${ciclo}</div></section>${hist}</div>
    <section class="card"><div class="card-h"><h2>Regras desta escala</h2>${S.podeEditar?'<button class="lnk" data-act="editar-escala">Alterar</button>':''}</div><div class="card-b"><ul class="rules">${textoRegras(e,n).map(([i,t])=>`<li><span class="ri">${icon(i)}</span><span>${t}</span></li>`).join('')}</ul></div></section></div>`;

/* ================= plantonistas ================= */
function vPlantonistas(){
  if(!escalasOrd().length)return vazioGeral();
  const idx=indice(),q=S.busca.trim().toLowerCase();
  const filt=idx.filter(p=>!q||p.nome.toLowerCase().includes(q));
  const ativos=filt.filter(p=>p.plantoes.length),inativos=filt.filter(p=>!p.plantoes.length);
  let sel=idx.find(p=>p.nome===S.pessoaSel)||idx.find(p=>p.nome===S.eu&&p.plantoes.length)||ativos[0]||idx[0];
  if(sel)S.pessoaSel=sel.nome;
  const item=p=>{const nx=p.plantoes[0];return `<li class="${p.plantoes.length?'':'off'}"><button data-act="sel-pessoa" data-n="${esc(p.nome)}" aria-current="${sel&&p.nome===sel.nome}">${av(p.nome)}<span><span class="t1">${esc(p.nome)}${p.nome===S.eu?' <span class="mini acc">você</span>':''}</span><span class="t2">${nx?esc(p.escalas.size+(p.escalas.size>1?' escalas':' escala')+' · próximo '+DIAS_C[dow(nx.data)]+' '+brC(nx.data)):'Fora das escalas atuais'}</span></span>${nx?`<span class="pos ${pc(nx.i)}">${esc(nx.rot)}</span>`:''}</button></li>`};
  const lista=`<section class="card" style="overflow:hidden"><div class="card-h"><h2>Equipe</h2><span class="mini">${idx.filter(p=>p.plantoes.length).length} ativos</span></div><div style="padding:0 18px 12px"><label class="sr" for="busca">Buscar plantonista</label><input class="inp" id="busca" type="search" placeholder="Buscar por nome" value="${esc(S.busca)}" autocomplete="off"></div><ul class="plist">${ativos.map(item).join('')}${inativos.length?`<li style="padding:10px 18px 4px" class="muted"><small>Saíram das escalas</small></li>${inativos.map(item).join('')}`:''}</ul>${!filt.length?'<p class="muted" style="padding:6px 18px 16px">Nenhum nome encontrado.</p>':''}</section>`;
  let det='';
  if(sel){
    const cont=new Map();sel.plantoes.forEach(x=>{const c=cont.get(x.rot)||{rot:x.rot,i:x.i,n:0};c.n++;c.i=Math.min(c.i,x.i);cont.set(x.rot,c)});
    const cs=[...cont.values()].sort((a,b)=>a.i-b.i),mx=Math.max(1,...cs.map(c=>c.n));
    const escs=escalasOrd().filter(e=>sel.escalas.has(e.id));
    det=`<div><div class="pd-h">${av(sel.nome,'lg')}<div style="flex:1;min-width:0"><h1>${esc(sel.nome)}</h1><p class="meta" style="margin:2px 0 0">${sel.plantoes.length?esc(sel.plantoes.length+' plantões nos próximos 12 meses · '+escs.map(e=>e.nome).join(', ')):'Sem plantões nos próximos 12 meses'}</p></div>
      <div class="acts">${sel.nome===S.eu?`<button class="btn ghost sm" data-act="eu-limpar">${icon('me')} É você</button>`:`<button class="btn ghost sm" data-act="eu-set" data-n="${esc(sel.nome)}">${icon('me')} Sou eu</button>`}${S.podeEditar&&sel.plantoes.length?`<button class="btn ghost sm" data-act="saida-global" data-n="${esc(sel.nome)}">${icon('sai')} Registrar saída</button>`:''}</div></div>
      <div class="duo"><section class="card"><div class="card-h"><h2>Próximos plantões</h2></div><div class="card-b">${sel.plantoes.length?`<ul class="lst">${sel.plantoes.slice(0,10).map(x=>itemData(x.data,esc(x.e.nome),esc(extenso(x.data)+' de '+x.data.slice(0,4)),`<span class="pos ${pc(x.i)}">${esc(x.rot)}</span>`,`data-act="dia-painel" data-d="${x.data}"`)).join('')}</ul>`:'<p class="muted">Nenhum plantão futuro.</p>'}</div></section>
      <section class="card"><div class="card-h"><h2>Posições nos próximos 12 meses</h2></div><div class="card-b">${cs.length?`<div class="bars">${cs.map(c=>`<div class="bar ${pc(c.i)}"><span class="pos ${pc(c.i)}">${esc(c.rot)}</span><span class="tr"><i style="width:${Math.round(c.n/mx*100)}%"></i></span><b>${c.n}</b></div>`).join('')}</div><p class="muted" style="font-size:13px;margin-top:12px">O rodízio distribui as posições por igual dentro de cada ciclo.</p>`:'<p class="muted">Sem dados.</p>'}</div></section></div></div>`;
  }
  return `${pageHead('Plantonistas','Toda a equipe, os próximos plantões e a distribuição das posições.')}${bannerAviso()}<div class="pp">${lista}${det}</div>`;
}

const scrim=document.getElementById('scrim');
function atualizarScrim(){const aberto=dlg.open||dlgc.open;scrim.hidden=!aberto;document.body.classList.toggle('modal-aberto',aberto)}

function abrir(html){dlg.innerHTML=html;mostrar(dlg);const f=dlg.querySelector('[autofocus]')||dlg.querySelector('input,select,textarea,button:not([data-act="fechar"])');if(f){try{f.focus({preventScroll:true})}catch(e){}}}

  S.form={id:novo?uid('esc-'):e.id,novo,nome:dup?base.nome+' (semana alternada)':base.nome,inicio:dup?addDias(base.inicio,7):base.inicio,frequencia:+base.frequencia||14,
    posicoes:rotulos(base,(base.equipe||[]).length),rotulosBase:rotulos(base,(base.equipe||[]).length),fixas:(()=>{const fx=fixasDe(base);return rotulos(base,(base.equipe||[]).length).map(l=>{const f=fx.find(x=>x.rot===l);return f?(f.ancora==='fim'?'fim':'depois:'+f.ancora):''})})(),prefixo:base.prefixo||'P',equipe:dup?[]:[...(base.equipe||[])],sentido:base.sentido||'desce',entradaPadrao:base.entradaPadrao||'ultima',

function proximaSemana(w){let d=hojeStr();while(dow(d)!==w)d=addDias(d,1);return d}
function formEsc(){
  const f=S.form,ps=f.posicoes.slice(0,f.equipe.length).map(x=>x.trim()),fixas=[];
  ps.forEach((l,i)=>{const v=f.fixas[i]||'';if(!v||!l)return;const anc=v==='fim'?'fim':v.slice(7);if(anc!=='fim'&&(!ps.includes(anc)||f.fixas[ps.indexOf(anc)]))return;fixas.push({rot:l,ancora:anc})});
  return {rotulos:ps,prefixo:f.prefixo.trim()||'P',entradaPadrao:f.entradaPadrao,fixas};

function fixasHtml(){
  const f=S.form,ps=f.posicoes.slice(0,f.equipe.length).map(x=>x.trim()),n=ps.length;
  if(!n)return '<small>Adicione a equipe primeiro.</small>';
  const linhas=ps.map((l,i)=>{const v=f.fixas[i]||'';
    const ops=[['','Não é fixa'],['fim','Sempre no final'],...ps.map((x,j)=>j!==i&&x&&!f.fixas[j]?['depois:'+x,'Sempre depois de '+x]:null).filter(Boolean)];

  const atual=rotulos(fe,n),confere=atual.join('|')===ps.join('|'),cresce=rotulos(fe,n+1);

  const e=S.escalas.find(x=>x.id===S.escalaSel);if(!e)return '';
  const hoje=hojeStr(),ate=S.faixa==='24'?addDias(hoje,730):addDias(hoje,365),de=S.faixa==='tudo'?e.inicio:hoje;
  const ls=gerar(e,ate).filter(l=>l.data>=de),maxN=Math.max(1,...ls.map(l=>l.equipe.length)),rM=rotulos(e,maxN);
  if(modo==='tsv')return ['Data\t'+rM.join('\t'),...ls.map(l=>br(l.data)+'\t'+rM.map(lab=>{const i=rotulos(e,l.equipe.length).indexOf(lab);return i<0?'':(l.equipe[i]===''?'Vago':l.equipe[i])}).join('\t'))].join('\n');
  return '*'+e.nome.toUpperCase()+'*\n'+ls.map(l=>{const r=rotulos(e,l.equipe.length);return br(l.data)+' | '+l.equipe.map((n,i)=>r[i]+': '+nomeOuVago(n)).join(' · ')}).join('\n');
}

/* ================= eventos ================= */
document.addEventListener('click',async ev=>{
  if(ev.target.closest('.skip')){ev.preventDefault();$('#main').focus();$('#main').scrollIntoView({block:'start'});return}
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if((S.publico||S.publicoErro)&&!['visao','faixa','copiar','fechar'].includes(a))return;
  const esc0=()=>S.escalas.find(x=>x.id===(b.dataset.id||S.escalaSel));
  switch(a){
    case 'nav':irPara(b.dataset.v);break;
    case 'dia':S.dia=b.dataset.d;if(S.view!=='painel')irPara('painel');else render();break;
    case 'dia-painel':S.dia=b.dataset.d;irPara('painel');break;
    case 'dia-mv':S.dia=addDias(S.dia,+b.dataset.n);render();break;
    case 'ver-escala':case 'sel-escala':S.escalaSel=b.dataset.id;if(S.view!=='escalas')irPara('escalas');else{render();}break;
    case 'faixa':S.faixa=b.dataset.v;render();break;
    case 'visao':S.visao=b.dataset.v;lsSet('rodizio-visao',S.visao);render();break;
    case 'nova-escala':abrirFormEscala(null);break;
    case 'editar-escala':{const e=esc0();if(e)abrirFormEscala(e)}break;
    case 'duplicar':{const e=esc0();if(e)abrirFormEscala(e,true)}break;
    case 'movimentar':{const e=esc0();if(e)abrirMov(e)}break;
    case 'link-publico':{const e=esc0();if(e)abrirLinkPublico(e)}break;
    case 'copiar-link':{const i=$('#pub-url');if(!i)break;const ok=()=>toast('Link copiado.');try{navigator.clipboard.writeText(i.value).then(ok,()=>{i.focus();i.select();toast('Selecionei o link: copie com Cmd+C ou Ctrl+C.')})}catch(e){i.focus();i.select()}}break;
    case 'incluir':{const e=esc0();if(e)abrirMov(e,{tipo:'entrada'})}break;
    case 'data-entrada':{const e=esc0();if(e)abrirMov(e,{tipo:'entrada',data:b.dataset.d})}break;
    case 'limpa':S.limpa=b.dataset.v==='1';render();window.scrollTo(0,0);break;
    case 'desfazer':{const e=esc0();if(!e)break;const evx=(e.eventos||[]).find(x=>x.id===b.dataset.ev);if(!evx)break;
      const l=linhaEm(e,proxima(e,evx.data));
      if(await confirmar('Desfazer mudança?','"'+descEv(evx,e,l)+'" será removida e a escala será recalculada a partir de '+br(proxima(e,evx.data))+'.','Desfazer',true)){salvarEscala(Object.assign({},e,{eventos:e.eventos.filter(x=>x.id!==evx.id)}));toast('Mudança desfeita.')}}break;
    case 'copiar':copiarTexto(textoEscala(b.dataset.modo));break;
    case 'sel-pessoa':S.pessoaSel=b.dataset.n;render();if(matchMedia('(max-width:899px)').matches)$('.pd-h')?.scrollIntoView({block:'start',behavior:'smooth'});break;
    case 'eu-set':S.eu=b.dataset.n;lsSet(LS_EU,S.eu);S.destaque=null;render();toast('Seus plantões aparecem no painel.');break;
    case 'eu-limpar':case 'eu-trocar':S.eu='';lsSet(LS_EU,'');S.destaque=null;render();break;
    case 'saida-global':abrirSaidaGlobal(b.dataset.n);break;
    case 'celula':abrirCelula(b.dataset.id,b.dataset.d,b.dataset.i);break;
    case 'cel-desfazer':desfazerAusencia();break;
    case 'ajustes':abrirAjustes();break;
    case 'fechar':fechar();break;
    case 'fe-add':addTeam();break;
    case 'fe-up':case 'fe-down':{const i=+b.dataset.i,j=a==='fe-up'?i-1:i+1,q=S.form.equipe;if(j<0||j>=q.length)break;[q[i],q[j]]=[q[j],q[i]];refreshForm();const nb=dlg.querySelector(`[data-act="${a}"][data-i="${j}"]`);(nb&&!nb.disabled?nb:dlg.querySelector(`[data-team="${j}"]`))?.focus()}break;
    case 'fe-dest':S.form.destaques[+b.dataset.i]=b.dataset.v;$('#fe-dest').innerHTML=destHtml();dlg.querySelector(`[data-act="fe-dest"][data-i="${b.dataset.i}"][data-v="${b.dataset.v}"]`)?.focus();break;
    case 'fe-del':{const f=S.form,n=f.equipe.length;f.posicoes.length=Math.min(f.posicoes.length,n);f.fixas.length=Math.max(f.fixas.length,n);f.destaques.length=Math.max(f.destaques.length,n);
      let sai=n-1;for(let j=n-1;j>=0;j--){if(!f.fixas[j]){sai=j;break}}
      const lab=f.posicoes[sai];f.equipe.splice(+b.dataset.i,1);f.posicoes.splice(sai,1);f.destaques.splice(sai,1);f.fixas.splice(sai,1);
      f.fixas=f.fixas.map(v=>v==='depois:'+lab?'':v);refreshForm()}break;
    case 'fe-ordem':{const f=S.form,fe=formEsc(),n=f.equipe.length,nova=rotulos(fe,n),dm={},fm={};
      f.posicoes.slice(0,n).forEach((l,i)=>{dm[l.trim()]=f.destaques[i]||'';fm[l.trim()]=f.fixas[i]||''});
      f.posicoes=nova.slice();f.destaques=nova.map(l=>dm[l]||'');f.fixas=nova.map(l=>fm[l]||'');refreshForm()}break;
    case 'fe-excluir':{const f=S.form;if(await confirmar('Excluir escala?','"'+f.nome+'" e todo o histórico de mudanças serão apagados para toda a equipe.','Excluir',true)){fechar();excluirEscala(f.id);toast('Escala excluída.')}}break;
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='hero-data'&&validaData(t.value)){S.dia=t.value;render()}
  else if(t.id==='destaque'){S.destaque=t.value;render()}
  else if(t.id==='eu-sel'&&t.value){S.eu=t.value;lsSet(LS_EU,S.eu);S.destaque=null;render()}
});
document.addEventListener('input',ev=>{if(ev.target.id==='busca'){S.busca=ev.target.value;render()}});
dlg.addEventListener('input',ev=>{
  const t=ev.target;
  if(S.form){
    if(t.dataset.f){S.form[t.dataset.f]=t.dataset.f==='frequencia'?+t.value:t.value;if(['prefixo','inicio'].includes(t.dataset.f))refreshForm()}
    else if(t.dataset.fix!==undefined){S.form.fixas[+t.dataset.fix]=t.value;const id=t.id;$('#fe-fixas').innerHTML=fixasHtml();const sl=$('#fe-entrada');if(sl)sl.innerHTML=entradaOpts();document.getElementById(id)?.focus()}
    else if(t.dataset.posn!==undefined){const i=+t.dataset.posn,old=S.form.posicoes[i];S.form.posicoes[i]=t.value;if(old)S.form.fixas=S.form.fixas.map(v=>v==='depois:'+old.trim()?'depois:'+t.value.trim():v);const ff=$('#fe-fixas');if(ff&&document.activeElement===t)ff.innerHTML=fixasHtml();if(old&&S.form.entradaPadrao===old)S.form.entradaPadrao=t.value.trim()||'ultima';const sl=$('#fe-entrada');if(sl)sl.innerHTML=entradaOpts()}
    else if(t.dataset.team!==undefined)S.form.equipe[+t.dataset.team]=t.value;
    else if(t.name==='sentido')S.form.sentido=t.value;
    else if(t.name==='cor')S.form.cor=t.value;
  }else if(S.mov){
    const m=S.mov;
    if(t.name==='mv-tipo'){m.tipo=t.value;m.nome='';m.sai='';renderMov();dlg.querySelector('input[name="mv-tipo"]:checked')?.focus()}
    else if(t.id==='mv-data'){if(validaData(t.value)){m.data=t.value;m.sai='';m.nome=m.tipo==='entrada'?m.nome:'';renderMov();$('#mv-data')?.focus()}}
    else if(t.id==='mv-sai'){m.sai=t.value;refreshMov()}
    else if(t.id==='mv-entra'){m.entra=t.value;refreshMov()}
    else if(t.id==='mv-nome'){m.nome=t.value;refreshMov()}
    else if(t.id==='mv-saida'){m.nome=t.value;refreshMov()}
    else if(t.id==='mv-pos'){m.posicao=t.value;refreshMov()}
  }else if(S.cel){
    if(t.name==='cel-modo'){S.cel.modo=t.value;renderCel();dlg.querySelector('input[name="cel-modo"]:checked')?.focus()}
    else if(t.id==='cel-nome'){S.cel.nome=t.value;refreshCel()}
  }else if(S.sg){
    if(t.id==='sg-data'&&validaData(t.value)){S.sg.data=t.value;refreshSg()}
    else if(t.id==='sg-sub'){S.sg.sub=t.value;refreshSg()}
  }
});
dlg.addEventListener('change',ev=>{const t=ev.target;if(S.form&&(t.name==='sentido'||t.name==='cor'))S.form[t.name]=t.value});
dlg.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='fe-novo'){ev.preventDefault();addTeam()}});
dlg.addEventListener('submit',ev=>{
  ev.preventDefault();const id=ev.target.id;
  if(id==='f-escala')salvarForm();
  else if(id==='f-mov')aplicarMov();
  else if(id==='f-sg')aplicarSg();
  else if(id==='f-cel')aplicarCel();
  else if(id==='f-aj'){const eu=$('#aj-eu').value;S.eu=eu;lsSet(LS_EU,eu);S.destaque=null;const sv=$('#aj-svc').value.trim();const mudou=S.podeEditar&&sv!==(S.config.servico||'');fechar();if(mudou)salvarConfig(Object.assign({},S.config,{servico:sv}));else render();toast('Ajustes salvos.')}
});

iniciar();
</script>
